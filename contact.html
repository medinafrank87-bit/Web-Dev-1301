<!DOCTYPE html>
<!-- Frank Medina, contact.html, October 26, 2026 -->
<html lang="en">
<head>
    <title>Contact | 240SX Build Log</title>
    <meta name="description" content="Have a question about my 240SX build or parts list? Send me a message using the contact form.">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Header with the site name -->
    <header>
        <h1>240SX Build Log</h1>

        <!-- Navigation links to the other pages -->
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="build-log.html">Build Log</a></li>
                <li><a href="parts-specs.html">Parts &amp; Specs</a></li>
                <li><a href="contact.html" class="current">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main content area -->
    <main>

        <h2>Contact</h2>
        <p>Have a question about the build or the parts list? Send me a message.</p>

        <form action="#" method="post">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your full name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="name@example.com" required>

            <label for="phone">Phone (optional)</label>
            <input type="tel" id="phone" name="phone" placeholder="555-555-5555">

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" placeholder="Ask about the build or the parts list" required></textarea>

            <button type="submit">Send</button>
        </form>

    </main>

    <!-- Footer -->
    <footer>
        <p>Frank Medina</p>
        <p>&copy; 2026. All Rights Reserved.</p>
    </footer>

</body>
</html>
